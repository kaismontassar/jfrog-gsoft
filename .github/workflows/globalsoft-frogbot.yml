name: GlobalSoft Frogbot PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scan:
    name: Scan pull request dependencies
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.id == 85876657 &&
      github.actor_id == '85876657'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      security-events: write
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Scan pull request with Frogbot
        uses: jfrog/frogbot@a22483eb236de56eaf17174b50f7a5cc16d85e33
        with:
          version: '2.35.3'
          oidc-provider-name: globalsoft-github
          oidc-audience: globalsoft-github-actions
        env:
          JF_URL: https://jfrogkmm.jfrog.io
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_WORKING_DIR: examples/npm-app
          JF_INSTALL_DEPS_CMD: npm ci --ignore-scripts --no-audit --no-fund
          JF_FAIL: 'true'
          JF_INCLUDE_ALL_VULNERABILITIES: 'false'
          JF_AVOID_PREVIOUS_PR_COMMENTS_DELETION: 'true'
